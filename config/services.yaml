services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $defaultBaseOrigin: '%ratingstar_seal.base_origin%'

    RatingStar\ContaoSealBundle\:
        resource: '../src/'
        exclude:
            - '../src/ContaoManager/'
            - '../src/DependencyInjection/'
            - '../src/RatingStarSealBundle.php'
            - '../src/Seal/SealOptions.php'
            - '../src/Seal/SealSettings.php'
            - '../src/Seal/SealSubject.php'
            - '../src/Seal/SealVariants.php'
            - '../src/Verification/ProfileVerification.php'

    # Cached RatingStar responses live in their own pool (declared in
    # RatingStarSealExtension::prepend), so they can be cleared separately:
    # cache:pool:clear ratingstar_seal.cache
    RatingStar\ContaoSealBundle\JsonLd\JsonLdProvider:
        arguments:
            $cache: '@ratingstar_seal.cache'

    # Called by the back end module "System maintenance" via the container.
    RatingStar\ContaoSealBundle\Maintenance\CachePurger:
        public: true
